CommonServices:
  systematicsHistogram: systematicsList
  separateWeightSystematics: true

Jets:
- containerName: SmallR
  jetCollection: AntiKt4EMPFlowJets
  recalibratePhyslite: true
  runTruthJetTagging: true
  runGhostMuonAssociation: false
  runUncertainties: true
  systematicsModelJES: Category
  systematicsModelJER: Full
  runJERsystematicsOnData: false
  runJvtUpdate: false
  runNNJvtUpdate: true
  runJvtSelection: false
  runFJvtSelection: false
  JVTWorkingPoint:
  - selectionName: baselineJvt
    jvtWP: FixedEffPt
    useSuffix: false

- containerName: LargeR
  jetCollection: AntiKt10UFOCSSKSoftDropBeta100Zcut10Jets
  recalibratePhyslite: true
  runTruthJetTagging: true
  runGhostMuonAssociation: false
  runUncertainties: true
  systematicsModelJER: Full
  systematicsModelJMS: Full
  systematicsModelJMR: Full
  runJERsystematicsOnData: false
  minPt: 200000.0
  maxPt: 3000000.0
  maxEta: 0.0
  maxRapidity: 2.0
  minMass: 40000.0
  maxMass: 600000.0


AddConfigBlocks:
- modulePath: reference_observer
  functionName: ReferenceObserver
  algName: ReferenceObserver
  pos: Output

ReferenceObserver: {}

Output:
  treeName: analysis
  containers:
    sr_: SmallR
    lr_: LargeR
    "": EventInfo
  vars:
  - SmallR_%SYS%.refOriginalIndex -> sr_index_%SYS% type=uint32
  - LargeR_%SYS%.refOriginalIndex -> lr_index_%SYS% type=uint32
  - SmallR_%SYS%.refJesJerValidity -> sr_jesJerValidity_%SYS% type=uint32
  - EventInfo.eventNumber -> eventNumber type=uint64
  - EventInfo.runNumber -> runNumber type=uint32
  - EventInfo.lumiBlock -> lumiBlock type=uint32
  - EventInfo.mcChannelNumber -> mcChannelNumber type=uint32
  - EventInfo.jvt_effSF_%SYS% -> sr_eventSF_%SYS% type=float
  - SmallR_%SYS%.jvt_selection -> sr_jvtSelection_%SYS% type=char
  - SmallR_%SYS%.no_jvt -> sr_jvtValidity_%SYS% type=uint32
  - SmallR_%SYS%.NNJvt -> sr_nnjvt_%SYS% type=float
  - SmallR_%SYS%.NNJvtPass -> sr_nnjvtPass_%SYS% type=char
  - SmallR_%SYS%.isJvtHS -> sr_isJvtHS_%SYS% type=char
  - LargeR_%SYS%.outOfValidity -> lr_jesJERJMSValidity_%SYS% type=uint32
  - LargeR_%SYS%.refJmrValidityOrAbsent -> lr_jmrValidity_%SYS% type=uint32
  - LargeR_%SYS%.selectPtEta -> lr_selectPtEta_%SYS% type=uint32
  - LargeR_%SYS%.selectMass -> lr_selectMass_%SYS% type=uint32
  - LargeR_%SYS%.R10TruthLabel_R21Precision_2022v1 -> lr_truthLabel_%SYS% type=int
  - LargeR_%SYS%.D2 -> lr_d2_%SYS% type=float
  - LargeR_%SYS%.Tau1_wta -> lr_tau1_%SYS% type=float
